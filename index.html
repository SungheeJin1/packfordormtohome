<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기숙사 짐싸기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC93C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="짐싸기">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/jua/jua.css">
<style>
/* Layout: page 1 is a train-ticket header over a single checklist column; page 2 is a full 3D stage with a packing panel on the right (stacked below on phones). */
:root {
  --bg: #E9EFF4;
  --surface: #FFFFFF;
  --ink: #1B2A41;
  --muted: #56677C;
  --line: #C9D5E0;
  --tag: #FFC93C;
  --tag-ink: #3A2A00;
  --go: #23A566;
  --warn: #D2691B;
  --scene-bg: #DCE6EE;
  --ink-shadow: #0B1422;
  --go-shadow: #16774A;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101823; --surface: #18222F; --ink: #E6EDF5; --muted: #98A8BC; --line: #2B3B4F;
    --tag: #F5BE3A; --tag-ink: #2A1E00; --go: #3CCB86; --warn: #F09A4A; --scene-bg: #1C2836; --ink-shadow: #05090F; --go-shadow: #1E8A58;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101823; --surface: #18222F; --ink: #E6EDF5; --muted: #98A8BC; --line: #2B3B4F;
  --tag: #F5BE3A; --tag-ink: #2A1E00; --go: #3CCB86; --warn: #F09A4A; --scene-bg: #1C2836; --ink-shadow: #05090F; --go-shadow: #1E8A58;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
body.on-bag { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Page 1: checklist ---------- */
#page-list {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 22px;
}
.ticket {
  position: relative;
  background: var(--tag);
  color: var(--tag-ink);
  border-radius: 22px;
  padding: 20px 22px 18px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 16px;
  /* perforated stub edge */
  -webkit-mask: radial-gradient(circle 9px at calc(100% - 92px) 0, transparent 98%, #000) top/100% 51% no-repeat,
                radial-gradient(circle 9px at calc(100% - 92px) 100%, transparent 98%, #000) bottom/100% 51% no-repeat;
          mask: radial-gradient(circle 9px at calc(100% - 92px) 0, transparent 98%, #000) top/100% 51% no-repeat,
                radial-gradient(circle 9px at calc(100% - 92px) 100%, transparent 98%, #000) bottom/100% 51% no-repeat;
}
.ticket::after {
  content: "";
  position: absolute;
  top: 14px; bottom: 14px; right: 92px;
  border-left: 2px dashed color-mix(in srgb, var(--tag-ink) 35%, transparent);
}
.route {
  display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap;
  font-family: var(--font-display);
  font-size: clamp(30px, 8vw, 44px);
  line-height: 1.1;
}
.route svg { width: 42px; height: 20px; flex: none; }
.ticket .sub { grid-column: 1; font-size: 15px; max-width: 34ch; margin: 0; min-width: 0; }
.stub {
  grid-column: 2; grid-row: 1 / span 2;
  width: 64px; text-align: center; align-self: center;
  font-family: var(--font-display); font-size: 12px; letter-spacing: .02em;
}
.stub b { display: block; font-size: 30px; line-height: 1; font-weight: 600; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

.add-form { display: flex; gap: 8px; }
.add-form input, .pack-form input {
  flex: 1; min-width: 0;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 18px;
}
.add-form input:focus, .pack-form input:focus { border-color: var(--ink); outline: none; }
.btn {
  border: 2px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
  border-radius: 16px;
  padding: 10px 18px;
  font-family: var(--font-display);
  font-size: 18px;
  white-space: nowrap;
  box-shadow: 0 4px 0 var(--ink-shadow);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink-shadow); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.small { font-size: 15px; padding: 6px 12px; border-width: 1.5px; }
.status { min-height: 1.4em; font-size: 14px; color: var(--muted); margin: -12px 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px dashed var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 15px;
  color: var(--muted);
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip.mine { border: 1.5px solid var(--tag); background: color-mix(in srgb, var(--tag) 22%, var(--surface)); color: var(--ink); }
.chip.mine small { color: var(--muted); font-size: 12px; margin-left: 2px; }

.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 10px 14px 10px 6px;
}
.checklist li.empty { display: block; }
.checklist li.dragging {
  position: relative; z-index: 2;
  border-color: var(--ink);
  box-shadow: 0 10px 24px rgba(10, 18, 30, .18);
}
.grip {
  border: 0; background: transparent; color: var(--muted);
  width: 30px; height: 36px; padding: 0; border-radius: 10px;
  display: grid; place-items: center;
  cursor: grab; touch-action: none;
}
.grip:hover { color: var(--ink); background: var(--bg); }
.dragging .grip { cursor: grabbing; color: var(--ink); }
.grip svg { width: 16px; height: 20px; }
.checklist li.packed .name { text-decoration: line-through; color: var(--muted); }
.checklist input[type="checkbox"] {
  appearance: none; width: 24px; height: 24px; margin: 0;
  border: 2.5px solid var(--ink); border-radius: 9px; display: grid; place-content: center; cursor: pointer;
  background: var(--surface);
}
.checklist input[type="checkbox"]:checked { background: var(--go); border-color: var(--go); }
.checklist input[type="checkbox"]:checked::after {
  content: ""; width: 12px; height: 7px; border: 3px solid #fff; border-top: 0; border-right: 0;
  transform: translateY(-2px) rotate(-45deg);
}
.name { min-width: 0; overflow-wrap: anywhere; font-size: 17px; }
.kind {
  font-size: 13px; font-family: var(--font-display); letter-spacing: 0;
  color: var(--muted); border: 1.5px solid var(--line); border-radius: 99px; padding: 1px 9px; white-space: nowrap;
}
.kind.unknown { border-style: dashed; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.del:hover { color: var(--warn); }
.empty {
  border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted);
}
.totals {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-display); font-size: 14px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.go {
  width: 100%;
  background: var(--go); border-color: var(--go); color: #fff;
  font-size: 22px; padding: 16px;
  box-shadow: 0 5px 0 var(--go-shadow);
}
.go:active { box-shadow: 0 1px 0 var(--go-shadow); }
.go:disabled { opacity: .45; cursor: not-allowed; }
.version { text-align: center; font-size: 12px; color: var(--muted); margin: -6px 0 0; }
.update-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  background: var(--ink); color: var(--bg);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.update-bar .btn { background: var(--tag); border-color: var(--tag); color: var(--tag-ink); box-shadow: none; font-size: 16px; padding: 6px 16px; }

/* ---------- Page 2: bag ---------- */
#page-bag {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  background: var(--scene-bg);
}
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(10, 18, 30, .28) 100%);
}
.stage-hud, .tip, .toast, .done { z-index: 1; }
.stage-hud {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  pointer-events: none;
}
.stage-hud > * { pointer-events: auto; }
.pill {
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px;
  font-family: var(--font-display); font-size: 14px; font-variant-numeric: tabular-nums;
}
.tip {
  position: absolute; pointer-events: none; transform: translate(-50%, -130%);
  background: var(--ink); color: var(--bg); padding: 4px 10px; border-radius: 8px; font-size: 14px; white-space: nowrap;
}
.panel {
  background: var(--surface);
  border-left: 1.5px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: 18px;
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  min-height: 0;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { display: grid; gap: 6px; }
.progress-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.progress-top b { font-family: var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--go); transition: width .35s ease; }
.pack-form { display: flex; gap: 6px; }
.pack-form .btn { padding: 10px 14px; }
.pack-form label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.bag-list { list-style: none; margin: 0; padding: 0 2px 0 0; overflow-y: auto; display: grid; gap: 6px; align-content: start; min-height: 0; flex: 1; }
.bag-list li {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px;
}
.bag-list li.packed { background: color-mix(in srgb, var(--go) 12%, var(--surface)); border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }
.bag-list .name { font-size: 16px; }
.bag-list input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--go); margin: 0 4px 0 0; }
.bag-list .name { cursor: pointer; }
.icon-btn {
  border: 0; background: transparent; color: var(--muted);
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; padding: 0;
}
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn.del:hover { color: var(--warn); }
.icon-btn svg { width: 18px; height: 18px; }
.rename {
  min-width: 0; width: 100%; font-size: 16px; padding: 4px 8px;
  border: 2px solid var(--ink); border-radius: 10px; background: var(--surface);
}
.list-hint { margin: -4px 0 0; font-size: 13px; color: var(--muted); }

.toast {
  position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 15px;
  max-width: calc(100% - 32px); text-align: center;
  transition: opacity .25s ease;
}
.toast.fade { opacity: 0; }
.done {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--scene-bg) 40%, transparent);
}
.done-card {
  background: var(--tag); color: var(--tag-ink); border-radius: 16px; padding: 24px 26px;
  max-width: 360px; width: 100%; display: grid; gap: 10px; text-align: center;
  box-shadow: 0 18px 40px rgba(0,0,0,.18);
}
.done-card h3 { font-family: var(--font-display); font-weight: 400; font-size: 32px; margin: 0; }
.done-card p { margin: 0; }
.done-card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.done-card .btn { background: var(--tag-ink); border-color: var(--tag-ink); color: var(--tag); }
.done-card .btn.ghost { background: transparent; color: var(--tag-ink); }

@media (max-width: 480px) {
  .ticket { padding: 18px 16px 16px; gap: 6px 12px; }
  .ticket .sub { font-size: 14px; }
}
@media (max-width: 760px) {
  .bag-list .kind { display: none; }
  #page-bag { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52% 48%; }
  .panel { border-left: 0; border-top: 1.5px solid var(--line); padding-top: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i, .toast, .btn { transition: none; }
}
</style>
</head>
<body>

<section id="page-list" aria-labelledby="list-title">
  <header class="ticket">
    <div class="route" aria-label="기숙사에서 집으로">
      <span>기숙사</span>
      <svg viewBox="0 0 42 20" aria-hidden="true"><path d="M0 10h36M28 2l9 8-9 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>집</span>
    </div>
    <p class="sub">가져갈 짐을 체크리스트로 적어요. 다 적으면 3D 가방에 하나씩 넣으러 가요.</p>
    <div class="stub"><b id="stub-count">0</b>짐 개수</div>
  </header>

  <div class="section-head">
    <h2 id="list-title">짐 리스트</h2>
    <button type="button" class="btn ghost small" id="clear-all">모두 지우기</button>
  </div>

  <form class="add-form" id="add-form" autocomplete="off">
    <input id="item-input" type="text" maxlength="30" placeholder="짐 이름 (예: 옷, 노트북, 칫솔)" aria-label="짐 이름" enterkeyhint="done">
    <button class="btn" type="submit">추가</button>
  </form>
  <p class="status" id="list-status" aria-live="polite"></p>

  <div>
    <p class="hint" style="margin-bottom:8px" id="suggest-hint">자주 챙기는 짐</p>
    <div class="chips" id="suggest"></div>
  </div>

  <ul class="checklist" id="checklist"></ul>

  <div class="totals">
    <span id="total-count">짐 0개</span>
  </div>

  <button class="btn go" id="go-bag" type="button">리스트 작성 완료 · 가방 싸러 가기</button>
  <p class="version" id="app-version"></p>
</section>

<div class="update-bar" id="update-bar" role="status" hidden>
  <span>새 버전이 있어요.</span>
  <button class="btn" type="button" id="update-now">지금 업데이트</button>
</div>

<section id="page-bag" hidden aria-label="가방 싸기">
  <div id="stage">
    <div class="stage-hud">
      <span class="pill" id="hud-count">0 / 0 챙김</span>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="toast fade" id="toast" aria-live="polite"></div>
    <div class="done" id="done" hidden>
      <div class="done-card" role="dialog" aria-labelledby="done-title">
        <h3 id="done-title">짐 싸기 끝!</h3>
        <p id="done-text"></p>
        <div class="btns">
          <button class="btn" type="button" id="reopen">계속 구경하기</button>
          <button class="btn ghost" type="button" id="done-back">리스트 보기</button>
        </div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <div class="panel-head">
      <button class="btn ghost small" type="button" id="back">← 리스트 수정</button>
      <span class="hint">드래그해서 돌려보기</span>
    </div>
    <div class="progress">
      <div class="progress-top"><span>가방에 넣은 짐</span><b id="prog-text">0 / 0</b></div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
    <form class="pack-form" id="pack-form" autocomplete="off">
      <label for="pack-input">챙긴 짐 이름</label>
      <input id="pack-input" type="text" maxlength="30" list="unpacked-names" placeholder="챙긴 짐 이름 입력" enterkeyhint="done">
      <datalist id="unpacked-names"></datalist>
      <button class="btn" type="submit">넣기</button>
      <button class="btn ghost" type="button" id="list-only" aria-label="가방에 넣지 않고 리스트에만 추가">+리스트</button>
    </form>
    <p class="list-hint">체크하면 가방에 넣고, 체크를 풀면 가방에서 빼요. 3D 가방 속 물건을 눌러도 빠져요.</p>
    <ul class="bag-list" id="bag-list"></ul>
  </aside>
</section>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/RoundedBoxGeometry.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script>
(() => {
'use strict';

/* =========================================================
   Data: item kinds. Order matters — earlier entries win, so
   "노트북" matches laptop before "노트" matches book.
   ========================================================= */
const KINDS = [
  { k: 'laptop',     label: '노트북',   w: 1.6,  keys: ['노트북', '맥북', '그램', 'laptop', 'macbook'] },
  { k: 'tablet',     label: '태블릿',   w: 0.5,  keys: ['태블릿', '아이패드', '갤럭시탭', 'ipad', 'tablet'] },
  { k: 'keyboard',   label: '키보드',   w: 0.7,  keys: ['키보드', 'keyboard'] },
  { k: 'charger',    label: '충전기',   w: 0.25, keys: ['충전기', '케이블', '어댑터', '멀티탭', '보조배터리', 'charger', 'cable'] },
  { k: 'headphones', label: '헤드폰',   w: 0.3,  keys: ['헤드폰', '헤드셋', 'headphone', 'headset'] },
  { k: 'earbuds',    label: '이어폰',   w: 0.06, keys: ['이어폰', '에어팟', '버즈', 'earphone', 'airpods', 'earbuds'] },
  { k: 'phone',      label: '휴대폰',   w: 0.2,  keys: ['휴대폰', '핸드폰', '스마트폰', '폰', 'phone'] },
  { k: 'mouse',      label: '마우스',   w: 0.1,  keys: ['마우스', 'mouse'] },
  { k: 'camera',     label: '카메라',   w: 0.6,  keys: ['카메라', 'camera'] },

function kindOf(name) {
  const n = name.toLowerCase().replace(/\s+/g, '');
  for (const kind of KINDS) {
    for (const key of kind.keys) if (n.includes(key)) return kind;
  }
  return BOX_KIND;
}

/* ---------- state ---------- */
const STORE_KEY = 'pack-dorm-home-v1';
let items = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) { /* storage unavailable */ }
  return SAMPLE.map((name, i) => ({ id: uid(), name, packed: false, packedAt: 0 }));
}
// how often the user has written each item, kept across visits
const HIST_KEY = 'pack-dorm-home-history-v1';
let history = loadHistory();
function loadHistory() {
  try {
    const h = JSON.parse(localStorage.getItem(HIST_KEY) || '{}');
    if (h && typeof h === 'object' && !Array.isArray(h)) return h;
  } catch (e) { /* storage unavailable */ }
  return {};
}
function bumpHistory(name) {
  history[name] = (history[name] || 0) + 1;
  try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) { /* ignore */ }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch (e) { /* ignore */ }
}
function uid() { return Math.random().toString(36).slice(2, 10); }
const $ = (id) => document.getElementById(id);

   ========================================================= */
function renderList() {
  const ul = $('checklist');
  ul.innerHTML = '';
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 적은 짐이 없어요. 위 칸에 짐 이름을 적거나 자주 챙기는 짐을 눌러 보세요.';
    ul.appendChild(li);
  }
  for (const it of items) {
    const kind = kindOf(it.name);
    const li = document.createElement('li');
    if (it.packed) li.classList.add('packed');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = it.packed;
    cb.id = 'chk-' + it.id;
    cb.setAttribute('aria-label', it.name + ' 가방에 넣음');
    cb.addEventListener('change', () => { setPacked(it.id, cb.checked); });
    const nm = document.createElement('label');
    nm.className = 'name';
    nm.htmlFor = cb.id;
    nm.textContent = it.name;
    const kd = document.createElement('span');
    kd.className = 'kind' + (kind === BOX_KIND ? ' unknown' : '');
    kd.textContent = kind === BOX_KIND ? '상자로 표시' : kind.label;
    kd.title = '가방 속 3D 모양';
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', it.name + ' 지우기');
    del.addEventListener('click', () => {
      items = items.filter((x) => x.id !== it.id);
      save(); renderAll();
    });
    const grip = iconButton('grip', it.name + ' 순서 옮기기 (끌거나 위아래 화살표)', GRIP);
    grip.addEventListener('pointerdown', (e) => startDrag(e, li));
    grip.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const i = items.findIndex((x) => x.id === it.id);
      const j = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (j < 0 || j >= items.length) return;
      [items[i], items[j]] = [items[j], items[i]];
      save(); renderAll();
      $('checklist').querySelector(`li[data-id="${it.id}"] .grip`).focus();
    });
    const edit = iconButton('icon-btn', it.name + ' 이름 고치기', PENCIL);
    edit.addEventListener('click', () => startRename(li, nm, it, renderList));
    li.dataset.id = it.id;
    li.append(grip, cb, nm, kd, edit, del);
    ul.appendChild(li);
  }
  const names = new Set(items.map((i) => i.name));
  const sg = $('suggest');
  sg.innerHTML = '';
  const mine = Object.keys(history).sort((a, b) => history[b] - history[a]);
  const pool = [...mine, ...SUGGEST.filter((s) => !(s in history))].filter((s) => !names.has(s));
  $('suggest-hint').textContent = mine.length ? '자주 챙기는 짐 · 노란 칸은 내가 자주 적은 짐' : '자주 챙기는 짐';
  pool.slice(0, 16).forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    const count = history[s] || 0;
    b.className = count ? 'chip mine' : 'chip';
    b.textContent = '+ ' + s;
    if (count > 1) {
      const c = document.createElement('small');
      c.textContent = '×' + count;
      b.appendChild(c);
    }
    b.addEventListener('click', () => addItem(s));
    sg.appendChild(b);
  });
  $('stub-count').textContent = items.length;
  $('total-count').textContent = `짐 ${items.length}개 · 챙김 ${items.filter((i) => i.packed).length}개`;
  $('go-bag').disabled = items.length === 0;
}

function addItem(name, packed = false) {
  name = name.trim();
  if (!name) return null;
  if (items.some((i) => i.name === name)) {
    $('list-status').textContent = `"${name}"은(는) 이미 리스트에 있어요.`;
    return null;
  }
  const it = { id: uid(), name, packed, packedAt: packed ? Date.now() : 0 };
  items.push(it);
  bumpHistory(name);
  const kind = kindOf(name);
  $('list-status').textContent = kind === BOX_KIND
    ? `"${name}" 추가. 모양을 몰라서 이름표 붙은 상자로 넣을게요.`
    : `"${name}" 추가. 가방에는 ${kind.label} 모양으로 들어가요.`;
  save(); renderAll();
  return it;
}

function setPacked(id, packed) {
  const it = items.find((x) => x.id === id);
  if (!it || it.packed === packed) return;
  it.packed = packed;
  it.packedAt = packed ? Date.now() : 0;
  save(); renderAll();
  if (scene3d) syncScene();
}

const PENCIL = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3L7 16H4v-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const CROSS = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function iconButton(cls, label, svg) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.setAttribute('aria-label', label);
  b.title = label;
  b.innerHTML = svg;
  return b;

const GRIP = '<svg viewBox="0 0 16 20" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="4" r="1.8"/><circle cx="11" cy="4" r="1.8"/><circle cx="5" cy="10" r="1.8"/><circle cx="11" cy="10" r="1.8"/><circle cx="5" cy="16" r="1.8"/><circle cx="11" cy="16" r="1.8"/></g></svg>';

// drag a checklist row by its grip; rows swap as it passes their midpoint
function startDrag(e, li) {
  if (e.button > 0) return;
  e.preventDefault();
  const ul = $('checklist');
  const grip = e.currentTarget;
  grip.setPointerCapture(e.pointerId);
  const naturalTop = () => {
    const t = li.style.transform;
    li.style.transform = '';
    const top = li.getBoundingClientRect().top + window.scrollY;
    li.style.transform = t;
    return top;
  };
  const baseTop = naturalTop();
  const startY = e.clientY + window.scrollY;
  let lastY = e.clientY;
  let scrollTimer = 0;
  li.classList.add('dragging');

  const place = () => {
    const dy = lastY + window.scrollY - startY;
    const visTop = baseTop + dy;
    const mid = visTop + li.offsetHeight / 2;
    let moved = true;
    while (moved) {
      moved = false;
      const next = li.nextElementSibling, prev = li.previousElementSibling;
      if (next) {
        const r = next.getBoundingClientRect();
        if (mid > r.top + window.scrollY + r.height / 2) { ul.insertBefore(next, li); moved = true; continue; }
      }
      if (prev) {
        const r = prev.getBoundingClientRect();
        if (mid < r.top + window.scrollY + r.height / 2) { ul.insertBefore(prev, li.nextSibling); moved = true; }
      }
    }
    li.style.transform = `translateY(${visTop - naturalTop()}px)`;
  };
  const autoScroll = () => {
    const edge = 70;
    const v = lastY < edge ? -(edge - lastY) / 4 : lastY > innerHeight - edge ? (lastY - innerHeight + edge) / 4 : 0;
    if (v) { window.scrollBy(0, v); place(); }
    scrollTimer = requestAnimationFrame(autoScroll);
  };
  // rows swap by moving the neighbour, never the dragged row, so the grip keeps its pointer capture
  const onMove = (ev) => { if (ev.pointerId === e.pointerId) { lastY = ev.clientY; place(); } };
  const onEnd = (ev) => {
    if (ev.pointerId !== e.pointerId) return;
    cancelAnimationFrame(scrollTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onEnd);
    window.removeEventListener('pointercancel', onEnd);
    li.classList.remove('dragging');
    li.style.transform = '';
    const order = [...ul.children].map((el) => el.dataset.id);
    const byId = new Map(items.map((x) => [x.id, x]));
    items = order.map((id) => byId.get(id)).filter(Boolean);
    save(); renderAll();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onEnd);
  window.addEventListener('pointercancel', onEnd);
  scrollTimer = requestAnimationFrame(autoScroll);
}

function startRename(li, nm, it, rerender = renderBagPanel) {
  const input = document.createElement('input');
  input.className = 'rename';
  input.id = 'rename-' + it.id;
  input.value = it.name;
  input.maxLength = 30;
  input.setAttribute('enterkeyhint', 'done');
  input.setAttribute('aria-label', it.name + ' 새 이름');
  nm.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const name = input.value.trim();
    if (commit && name && name !== it.name) {
      if (items.some((x) => x.id !== it.id && x.name === name)) {
        notify(`"${name}"은(는) 이미 리스트에 있어요.`);
      } else {
        renameItem(it, name);
        return;
      }
    }
    rerender();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); input.blur(); }
    else if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

function renameItem(it, name) {
  const old = it.name;
  it.name = name;
  bumpHistory(name);
  // the 3D model depends on the name, so drop a fresh one into the bag
  const st = live.get(it.id);
  if (st) {
    itemsGroup.remove(st.outer);
    live.delete(it.id);
  }
  save(); renderAll(); syncScene();
  notify(`"${old}" → "${name}"(으)로 고쳤어요.`);
}

function renderAll() {
  renderList();
  renderBagPanel();
}

const TOUCH = window.matchMedia('(pointer: coarse)').matches;
function settleKeyboard(input) {
  if (TOUCH) input.blur(); else input.focus();
}
$('list-only').addEventListener('click', () => {
  const input = $('pack-input');
  const q = input.value.trim();
  if (!q) { toast('리스트에 넣을 짐 이름을 먼저 적어 주세요.'); return; }
  if (addItem(q, false)) toast(`"${q}"을(를) 리스트에 추가했어요.`);
  else toast(`"${q}"은(는) 이미 리스트에 있어요.`);
  input.value = '';
  settleKeyboard(input);
});
$('pack-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('pack-input');
  const q = input.value.trim();
  if (!q) return;
  const norm = (s) => s.toLowerCase().replace(/\s+/g, '');
  const nq = norm(q);
  const unpacked = items.filter((i) => !i.packed);
  let hit = unpacked.find((i) => norm(i.name) === nq)
    || unpacked.find((i) => norm(i.name).includes(nq) || nq.includes(norm(i.name)));
  if (hit) {
    setPacked(hit.id, true);
    toast(`${hit.name}을(를) 가방에 넣었어요.`);
  } else if (items.some((i) => i.packed && norm(i.name) === nq)) {
    toast(`${q}은(는) 이미 가방에 있어요.`);
  } else {
    const it = addItem(q, true);
    if (it) { syncScene(); toast(`리스트에 없던 "${q}"을(를) 추가하고 가방에 넣었어요.`); }
  }
  input.value = '';
  settleKeyboard(input);
});

function rbox(w, h, d) {
  const rad = Math.min(Math.min(w, h, d) * 0.42, 0.07);
  return rad > 0.004 ? new THREE.RoundedBoxGeometry(w, h, d, 3, rad) : new THREE.BoxGeometry(w, h, d);
}
// three r128 treats hex colors as linear; convert once so sRGB output keeps the intended palette
function linearize(root) {
  root.traverse((o) => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (m.userData.lin) return;
      m.userData.lin = true;
      if (m.color) m.color.convertSRGBToLinear();
      if (m.emissive) m.emissive.convertSRGBToLinear();
      if (m.map) m.map.encoding = THREE.sRGBEncoding;
      if ('envMapIntensity' in m) m.envMapIntensity = 0.45;
    });
  });
}
function mat(color, rough = 0.7, metal = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });

function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function flat(shape, depth, material, bevel = 0.04) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 14 });
  g.rotateX(-Math.PI / 2);
  return mesh(g, material);
}
function shapeFrom(points) {
  const s = new THREE.Shape();
  s.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) {
    const p = points[i];
    if (p.length === 4) s.quadraticCurveTo(p[0], p[1], p[2], p[3]);
    else s.lineTo(p[0], p[1]);
  }
  s.closePath();
  return s;
}
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  return () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
}

function labelTexture(text, bg = '#C8A06A', fg = '#3B2A14', w = 512, h = 256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = fg;
  let size = 110;
  g.font = `${size}px Jua, sans-serif`;
  while (g.measureText(text).width > w * 0.86 && size > 30) { size -= 6; g.font = `${size}px Jua, sans-serif`; }

}

function buildItem(it) {
  const kind = kindOf(it.name);
  const r = rng(hash(it.name));
  const model = BUILD[kind.k](r, it.name);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = Math.min(CELL_W * 0.92 / size.x, CELL_D * 0.92 / size.z, 1.1);
  const holder = new THREE.Group();
  model.position.set(-center.x, -box.min.y, -center.z);
  holder.add(model);
  holder.scale.setScalar(s);
  const h = size.y * s;
  holder.position.y = -h / 2; // outer pivot sits at the item's center
  const outer = new THREE.Group();
  outer.add(holder);
  outer.userData.itemId = it.id;
  outer.traverse((o) => { o.userData.itemId = it.id; });
  linearize(outer);
  return { outer, h, yaw: (r() - 0.5) * 0.4 };
}

/* ---------- room + suitcase ---------- */
function woodTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  const tones = ['#B98A5E', '#C49468', '#AD7F55', '#BE8F62'];
  for (let i = 0; i < 8; i++) {
    g.fillStyle = tones[i % tones.length];
    g.fillRect(0, i * 64, 512, 64);
    g.fillStyle = 'rgba(60,35,15,.25)';
    g.fillRect(0, i * 64, 512, 2);
    g.fillRect((i * 173) % 512, i * 64, 2, 64);
    for (let k = 0; k < 14; k++) {
      g.strokeStyle = 'rgba(80,50,25,.12)';
      g.beginPath();
      const y = i * 64 + 6 + Math.random() * 52;
      g.moveTo(0, y);
      g.bezierCurveTo(170, y + 4, 340, y - 4, 512, y + 2);
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  t.anisotropy = 8;
  return t;
}

function roundRect(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// extrude a flat shape upward (y) with soft bevelled edges
function lift(shape, h, material, bevel = 0.04) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.001, h - bevel * 2), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.6, bevelSegments: 5, curveSegments: 16 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, bevel, 0);
  return mesh(g, material);
}
function ring(w, d, r, t) {
  const s = roundRect(w, d, r);
  s.holes.push(roundRect(w - t * 2, d - t * 2, Math.max(0.03, r - t)));
  return s;
}
// open-top rounded tub: floor + walls, bottom at y=0
function tub(h, material) {
  const g = new THREE.Group();
  g.add(lift(roundRect(OUT_W, OUT_D, CORNER), 0.1, material, 0.035));
  g.add(lift(ring(OUT_W, OUT_D, CORNER, WALL), h, material, 0.045));
  return g;
}

function buildSuitcase() {
  const g = new THREE.Group();
  const shell = new THREE.MeshPhysicalMaterial({ color: '#F0654A', roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.18 });

  const lining = mat('#FFE2A0', 1);
  const rubber = mat('#2B2F38', 0.55);
  const wallH = RIM_Y - BASE_Y;

  const base = tub(wallH, shell);
  base.position.y = BASE_Y;
  g.add(base);

  // fabric lining
  const lf = new THREE.Mesh(new THREE.ShapeGeometry(roundRect(IN_W - 0.04, IN_D - 0.04, CORNER - WALL), 16), lining);
  lf.rotation.x = -Math.PI / 2;
  lf.position.y = FLOOR_Y + 0.004;
  lf.receiveShadow = true;
  g.add(lf);
  const lw = lift(ring(IN_W - 0.04, IN_D - 0.04, CORNER - WALL, 0.025), wallH - 0.14, lining, 0);
  lw.position.y = FLOOR_Y;
  lw.castShadow = false;
  g.add(lw);

  // zipper band around the rim
  const zip = lift(ring(OUT_W + 0.03, OUT_D + 0.03, CORNER + 0.015, 0.07), 0.05, rubber, 0.015);
  zip.position.y = RIM_Y - 0.035;
  g.add(zip);

  // ribs on front and back
  for (let i = -2; i <= 2; i++) {
    for (const sz of [-1, 1]) {
      g.add(mesh(rbox(0.16, wallH * 0.72, 0.06), ribMat, i * 0.7, BASE_Y + wallH * 0.5, sz * (OUT_D / 2 + 0.01)));
    }
  }
  // wheels
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const hub = new THREE.Group();
    const tyre = mesh(new THREE.TorusGeometry(0.06, 0.035, 12, 24), rubber);
    tyre.rotation.y = Math.PI / 2;
    hub.add(tyre);
    hub.add(mesh(rbox(0.1, 0.12, 0.12), mat('#C9CED6', 0.3, 0.7), 0, 0.07, 0));
    hub.position.set(sx * (OUT_W / 2 - 0.35), 0.095, sz * (OUT_D / 2 - 0.3));
    g.add(hub);
  }
  // carry handle on front
  const handle = mesh(new THREE.TorusGeometry(0.28, 0.055, 14, 32, Math.PI), rubber, 0, RIM_Y - 0.36, OUT_D / 2 + 0.07);
  handle.rotation.x = -Math.PI / 2;
  handle.rotation.z = Math.PI;
  g.add(handle);
  for (const sx of [-0.28, 0.28]) g.add(mesh(rbox(0.12, 0.14, 0.08), rubber, sx, RIM_Y - 0.36, OUT_D / 2 + 0.04));
  // luggage tag
  const tag = new THREE.Group();
  const tagTex = labelTexture('기숙사 → 집', '#FFC93C', '#3A2A00', 512, 256);
  const card = new THREE.Mesh(rbox(0.5, 0.25, 0.02), mat('#FFC93C', 0.6));
  card.castShadow = true;
  card.position.y = -0.25;
  tag.add(card);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.22), new THREE.MeshStandardMaterial({ map: tagTex, roughness: 0.7 }));
  face.position.set(0, -0.25, 0.011);
  tag.add(face);
  tag.add(mesh(rbox(0.025, 0.16, 0.015), rubber, 0, -0.06, 0));
  tag.position.set(0.3, RIM_Y - 0.3, OUT_D / 2 + 0.13);
  tag.rotation.z = 0.14;
  g.add(tag);

  // lid, opened back (pivot at back top edge)
  const lid = new THREE.Group();
  lid.position.set(0, RIM_Y, -OUT_D / 2);
  const lidH = 0.34;
  const lidTub = tub(lidH, shell);
  lidTub.rotation.x = Math.PI;
  lidTub.position.set(0, lidH, OUT_D / 2);
  lid.add(lidTub);
  const ll = new THREE.Mesh(new THREE.ShapeGeometry(roundRect(IN_W - 0.04, IN_D - 0.04, CORNER - WALL), 16), lining);
  ll.rotation.x = Math.PI / 2;
  ll.position.set(0, lidH - 0.105, OUT_D / 2);
  ll.receiveShadow = true;
  lid.add(ll);
  const strapMat = mat('#2B3E5C', 0.9);
  const diag = Math.hypot(IN_W, IN_D);
  for (const a of [1, -1]) {
    const st = mesh(rbox(diag * 0.92, 0.02, 0.1), strapMat, 0, lidH - 0.12, OUT_D / 2);
    st.rotation.y = a * Math.atan2(IN_D, IN_W);
    lid.add(st);
  }
  lid.add(mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.03, 20), mat('#C9CED6', 0.3, 0.7), 0, lidH - 0.13, OUT_D / 2));
  for (let i = -2; i <= 2; i++) lid.add(mesh(rbox(0.16, 0.06, OUT_D * 0.7), ribMat, i * 0.7, lidH + 0.01, OUT_D / 2));
  lid.rotation.x = LID_OPEN;
  g.add(lid);
  return g;
}

function initScene() {
  const stage = $('stage');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.82;
  stage.prepend(renderer.domElement);

  scene3d = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene3d.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 6.4, 7.6);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.6, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 4;
  controls.maxDistance = 15;
  controls.maxPolarAngle = 1.38;
  controls.update();

  scene3d.add(new THREE.HemisphereLight(0xfff4e6, 0x4a3c30, 0.25));
  const sun = new THREE.DirectionalLight(0xffe8cc, 2.1);
  sun.position.set(3.5, 8, 4.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -4.5, right: 4.5, top: 4.5, bottom: -4.5, near: 1, far: 25 });
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.02;
  scene3d.add(sun);
  const rim = new THREE.DirectionalLight(0xb8d0ff, 0.45);
  rim.position.set(-5, 5, -4);
  scene3d.add(rim);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.8 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene3d.add(floor);
  const rug = new THREE.Mesh(new THREE.CircleGeometry(4.2, 64), mat('#7FB59F', 1));
  rug.rotation.x = -Math.PI / 2;
  rug.position.y = 0.005;
  rug.receiveShadow = true;
  scene3d.add(rug);
  const rugEdge = new THREE.Mesh(new THREE.RingGeometry(3.95, 4.15, 64), mat('#F4F0E6', 1));
  rugEdge.rotation.x = -Math.PI / 2;
  rugEdge.position.y = 0.008;
  rugEdge.receiveShadow = true;
  scene3d.add(rugEdge);
  wallMat = new THREE.MeshStandardMaterial({ color: '#DCE6EE', roughness: 1 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), wallMat);
  wall.position.set(0, 6, -6);
  wall.receiveShadow = true;
  scene3d.add(wall);
  const base = mesh(rbox(30, 0.3, 0.06), mat('#F4F4F2', 0.6), 0, 0.15, -5.97);
  scene3d.add(base);

  scene3d.add(buildSuitcase());
  itemsGroup = new THREE.Group();
  scene3d.add(itemsGroup);
  linearize(scene3d);

  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointermove', onHover);
  let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    down = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    const quick = performance.now() - down.t < 400;
    down = null;
    if (moved > 8 || !quick) return; // that was a drag to rotate
    const id = pickItem(e);
    const it = id && items.find((x) => x.id === id);
    if (it && it.packed) {
      $('tip').hidden = true;
      setPacked(it.id, false);
      toast(`${it.name}을(를) 가방에서 뺐어요.`);
    }
  });
  renderer.domElement.addEventListener('pointerleave', () => { $('tip').hidden = true; });
  window.addEventListener('resize', onResize);
}

function applyTheme() {
  const c = cssVar('--scene-bg') || '#DCE6EE';
  scene3d.background = new THREE.Color(c).convertSRGBToLinear();
  wallMat.color.set(c).convertSRGBToLinear();
}

function onResize() {
  if (!renderer) return;
  const stage = $('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // pull back on narrow screens so the whole suitcase stays in frame
  camera.fov = camera.aspect < 0.8 ? 58 : camera.aspect < 1.2 ? 48 : 40;
  camera.updateProjectionMatrix();
}

function pickItem(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(itemsGroup.children, true);
  for (const h of hits) {
    const st = live.get(h.object.userData.itemId);
    if (st && st.phase !== 'leaving') return h.object.userData.itemId;
  }
  return null;
}

function onHover(e) {
  if (e.pointerType === 'touch') return;
  const rect = renderer.domElement.getBoundingClientRect();
  const id = pickItem(e);
  renderer.domElement.style.cursor = id ? 'pointer' : '';
  const tip = $('tip');
  if (id) {
    const it = items.find((x) => x.id === id);
    if (it) {
      tip.textContent = it.name + ' · 눌러서 빼기';
      tip.style.left = (e.clientX - rect.left) + 'px';
      tip.style.top = (e.clientY - rect.top) + 'px';
      tip.hidden = false;
      return;
    }
  }
  tip.hidden = true;
}

/* ---------- packing layout + animation ---------- */
function relayout() {
  const packed = items.filter((i) => i.packed && live.has(i.id)).sort((a, b) => a.packedAt - b.packedAt);
  const stack = new Array(COLS * ROWS).fill(FLOOR_Y + 0.01);
  packed.forEach((it, i) => {
    const st = live.get(it.id);
    if (st.phase === 'leaving') return;
    const slot = i % (COLS * ROWS);
    const col = slot % COLS, row = Math.floor(slot / COLS);
    const x = -IN_W / 2 + CELL_W * (col + 0.5);
    const z = -IN_D / 2 + CELL_D * (row + 0.5);
    st.target.set(x, stack[slot] + st.h / 2, z);
    stack[slot] += st.h + 0.005;
  });
}

function syncScene(stagger = false) {
  if (!scene3d) return;
  const ids = new Set(items.filter((i) => i.packed).map((i) => i.id));
  // remove items no longer packed
  for (const [id, st] of live) {
    if (!ids.has(id) && st.phase !== 'leaving') {
      st.phase = 'leaving';
      st.t = 0;
      st.from = st.outer.position.clone();
    }
  }
  // add new
  const toAdd = items.filter((i) => i.packed && !live.has(i.id)).sort((a, b) => a.packedAt - b.packedAt);
  toAdd.forEach((it, k) => {
    const { outer, h, yaw } = buildItem(it);
    const st = {
      outer, h, yaw,
      target: new THREE.Vector3(),
      from: new THREE.Vector3((Math.random() - 0.5) * 3, 3.2, 4.4),
      phase: 'waiting',
      delay: stagger ? k * 0.14 : 0,
      t: 0, vy: 0, squash: 0,
      spin: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 8),
    };
    outer.visible = false;
    outer.position.copy(st.from);
    itemsGroup.add(outer);
    live.set(it.id, st);
  });
  relayout();
  const allPacked = items.length > 0 && items.every((i) => i.packed);
  if (!allPacked) {
    celebrated = false;
    $('done').hidden = true;
  }
}

const ease = (t) => 1 - Math.pow(1 - t, 3);
const wrapAngle = (a) => a - Math.PI * 2 * Math.round(a / (Math.PI * 2));
const tmp = new THREE.Vector3();

function updateItems(dt) {
  let settled = true;
  for (const [id, st] of live) {
    const o = st.outer;
    if (st.phase === 'waiting') {
      settled = false;
      st.delay -= dt;
      if (st.delay <= 0) {
        if (REDUCE) {
          st.phase = 'rest';
          o.position.copy(st.target);
          o.rotation.set(0, st.yaw, 0);
        } else {
          st.phase = 'flying';
        }
        o.visible = true;
      }
      continue;
    }
    if (st.phase === 'flying') {
      settled = false;
      st.t += dt / 0.6;
      const p = ease(Math.min(st.t, 1));
      tmp.copy(st.target); tmp.y += 1.7;
      o.position.lerpVectors(st.from, tmp, p);
      o.position.y += Math.sin(Math.PI * p) * 1.1;
      o.rotation.x += st.spin.x * dt;
      o.rotation.y += st.spin.y * dt;
      o.rotation.z += st.spin.z * dt;
      if (st.t >= 1) {
        st.phase = 'falling';
        st.vy = 0;
        o.rotation.set(wrapAngle(o.rotation.x), wrapAngle(o.rotation.y), wrapAngle(o.rotation.z));
      }
    } else if (st.phase === 'falling') {
      settled = false;
      st.vy -= 24 * dt;
      o.position.y += st.vy * dt;
      o.position.x += (st.target.x - o.position.x) * Math.min(1, 10 * dt);
      o.position.z += (st.target.z - o.position.z) * Math.min(1, 10 * dt);
      const k = Math.min(1, 9 * dt);
      o.rotation.x += (0 - o.rotation.x) * k;
      o.rotation.z += (0 - o.rotation.z) * k;
      o.rotation.y += (st.yaw - o.rotation.y) * k;
      if (o.position.y <= st.target.y) {
        o.position.y = st.target.y;
        const impact = Math.abs(st.vy);
        st.squash = Math.min(0.22, impact / 30);
        if (impact > 1.6) st.vy = impact * 0.3;
        else { st.phase = 'rest'; st.vy = 0; }
      }
    } else if (st.phase === 'rest') {
      const k = Math.min(1, 10 * dt);
      if (o.position.distanceToSquared(st.target) > 1e-5) settled = false;
      o.position.lerp(st.target, k);
      o.rotation.x += (0 - o.rotation.x) * k;
      o.rotation.z += (0 - o.rotation.z) * k;
      o.rotation.y += (st.yaw - o.rotation.y) * k;
    } else if (st.phase === 'leaving') {
      st.t += dt / (REDUCE ? 0.01 : 0.5);
      const p = ease(Math.min(st.t, 1));
      tmp.set(st.from.x * 1.5, 3.4, 5);
      o.position.lerpVectors(st.from, tmp, p);
      o.position.y += Math.sin(Math.PI * p) * 0.8;
      o.rotation.x -= 6 * dt;
      o.scale.setScalar(Math.max(0.01, 1 - p));
      if (st.t >= 1) {
        itemsGroup.remove(o);
        o.traverse((m) => { if (m.geometry) m.geometry.dispose(); });
        live.delete(id);
        relayout();
      }
      continue;
    }
    // landing squash spring
    st.squash *= Math.exp(-12 * dt);
    o.scale.set(1 + st.squash * 0.6, 1 - st.squash, 1 + st.squash * 0.6);
  }
  return settled;
}

function checkComplete(dt, settled) {
  const allPacked = items.length > 0 && items.every((i) => i.packed);
  if (allPacked && settled && !celebrated) {
    completeTimer += dt;
    if (completeTimer > 0.5) {
      celebrated = true;
      $('done-text').textContent = `짐 ${items.length}개를 다 챙겼어요. 집으로 출발!`;
      $('done').hidden = false;
      if (!REDUCE) burstConfetti();
    }
  } else {
    completeTimer = 0;
  }
}

function burstConfetti() {
  const colors = ['#FFC93C', '#E4572E', '#23A566', '#3A7BD5', '#F2A7B8', '#FFFFFF'];
  const geo = new THREE.PlaneGeometry(0.08, 0.14);
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: colors[i % colors.length], side: THREE.DoubleSide }));
    m.position.set((Math.random() - 0.5) * 1.2, 1.8, (Math.random() - 0.5) * 1.2);
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 3;
    linearize(m);
    confetti.push({ m, v: new THREE.Vector3(Math.cos(a) * s, 5 + Math.random() * 4, Math.sin(a) * s), spin: Math.random() * 10, life: 3.5 });
    scene3d.add(m);
  }
}
function updateConfetti(dt) {
  confetti = confetti.filter((c) => {
    c.life -= dt;
    c.v.y -= 9 * dt;
    c.v.multiplyScalar(Math.exp(-1.6 * dt));
    c.m.position.addScaledVector(c.v, dt);
    if (c.m.position.y < 0.02) { c.m.position.y = 0.02; c.v.set(0, 0, 0); }
    else { c.m.rotation.x += c.spin * dt; c.m.rotation.y += c.spin * 0.7 * dt; }
    if (c.life <= 0) { scene3d.remove(c.m); c.m.material.dispose(); return false; }
    return true;
  });
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const settled = updateItems(dt);
  checkComplete(dt, settled);
  updateConfetti(dt);
  controls.update();
  renderer.render(scene3d, camera);
  requestAnimationFrame(loop);
}

renderAll();

// keep in step with CACHE in sw.js
const APP_VERSION = '7';
$('app-version').textContent = '버전 ' + APP_VERSION;
$('update-now').addEventListener('click', () => location.reload());

const ONLINE_HOST = /^https?:$/.test(location.protocol);
if ('serviceWorker' in navigator && ONLINE_HOST) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* offline mode unavailable */ });
}
// a home-screen app is often resumed rather than reloaded, so look for a newer page each time it comes back
async function checkForUpdate() {
  if (!ONLINE_HOST || !navigator.onLine) return;
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) $('update-bar').hidden = false;
  } catch (e) { /* offline */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
checkForUpdate();
})();
</script>
</body>
